name: Pages (web)

# The Show Clusters web page. Independent of ci.yml (desktop): each has its own path
# filters and neither waits for the other.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned tools
        run: python -m pip install -q -r requirements-web.lock
      - name: Lint, format and type checks
        run: |
          ruff check web scripts tests
          ruff format --check web scripts tests
          mypy
      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: build/vendor
          key: pyodide-${{ hashFiles('scripts/vendor_pyodide.py') }}
      - name: Download and verify Pyodide
        run: python scripts/vendor_pyodide.py
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Unit and browser tests
        run: python -m pytest -v tests/web
      - name: Fetch saved ESA snapshots (latest snapshots-* release)
        id: snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '[.[].tagName | select(startswith("snapshots-"))] | sort | last // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern snapshots.tar.gz --dir build
            mkdir -p build/snapshots && tar -xzf build/snapshots.tar.gz -C build/snapshots
            echo "args=--snapshots build/snapshots" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No snapshots-* release yet; deploying without the saved-copy fallback."
            echo "args=--no-snapshots" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        run: python scripts/build_site.py ${{ steps.snapshots.outputs.args }}
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
