name: Pages (web)

# The StackImages web pages (home, Show Clusters, HR Diagram of Your Own Image).
# Independent of ci.yml (desktop): each has its own path filters and neither waits for
# the other. Changes to Markdown files alone (README.md, docs/) start neither workflow.
# Checks and builds run in the pinned containers from compose.yaml (web-tools, lint-js).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "scripts/zip_hr.py"
      - "scripts/web_version.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
      - "!**.md"  # documentation only: nothing to test or deploy
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "scripts/zip_hr.py"
      - "scripts/web_version.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
      - "!**.md"  # documentation only: nothing to test or deploy
  workflow_dispatch:  # also started by snapshots.yml after publishing new snapshots

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      fingerprint: ${{ steps.zip.outputs.fingerprint }}
      snapshots: ${{ steps.snapshots.outputs.tag }}
      version: ${{ steps.version.outputs.number }}
      version_new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Build tool images
        run: docker-compose build web-tools
      - name: JavaScript lint and type checks (eslint, tsc)
        run: docker-compose run --rm -T lint-js sh -c "npm ci --ignore-scripts --no-audit --no-fund && npm run check"
      - name: Python lint, format and type checks (ruff, mypy)
        run: docker-compose run --rm -T web-tools sh -c "ruff check web scripts tests && ruff format --check web scripts tests && mypy"
      - name: Cache Pyodide
        uses: actions/cache@v6
        with:
          path: build/vendor
          key: pyodide-${{ hashFiles('scripts/vendor_pyodide.py') }}
      - name: Download and verify Pyodide
        # build/ is created here, as the runner user: if the root container created it
        # (on a cache miss), later steps could not write the snapshots into it.
        run: |
          mkdir -p build/vendor
          docker-compose run --rm -T web-tools python scripts/vendor_pyodide.py
      - name: Unit, snapshot and browser tests
        run: docker-compose run --rm -T web-tools python -m pytest -v -p no:cacheprovider tests/web
      - name: Fetch saved snapshots (latest snapshots-* release)
        id: snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '[.[].tagName | select(startswith("snapshots-"))] | sort | last // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern snapshots.tar.gz --dir build --clobber
            rm -rf build/snapshots && mkdir -p build/snapshots
            tar -xzf build/snapshots.tar.gz -C build/snapshots
            echo "Using $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "args=--snapshots build/snapshots" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No snapshots-* release yet; deploying without the saved-copy fallback."
            echo "args=--no-snapshots" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        run: docker-compose run --rm -T web-tools python scripts/build_site.py ${{ steps.snapshots.outputs.args }}
      - name: Zip the site, and the HR page on its own, for hosting elsewhere
        id: zip
        run: |
          docker-compose run --rm -T web-tools python scripts/zip_site.py
          docker-compose run --rm -T web-tools python scripts/zip_hr.py
          fingerprint=$(docker-compose run --rm -T web-tools python scripts/zip_site.py --fingerprint _site/StackImages-web.zip)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # One version for the whole site (scripts/web_version.py): a changed site is the next
      # web-MAJOR.N, an unchanged one keeps its number. A pull request that changes the site
      # must add that version's entry to docs/CHANGELOG.md; CI names the number.
      - name: Decide the site version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.zip.outputs.fingerprint }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > build/releases.json
          answer=$(docker-compose run --rm -T web-tools python scripts/web_version.py next \
                     --fingerprint "$FINGERPRINT" --releases build/releases.json)
          read -r number state date <<< "$answer"
          [[ "$number" =~ ^[0-9]+\.[0-9]+$ && "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "::error::unexpected answer '$answer'"; exit 1; }
          echo "Site version $number ($state, $date)"
          { echo "number=$number"; echo "date=$date"; echo "new=$([ "$state" = new ] && echo true || echo false)"; } \
            >> "$GITHUB_OUTPUT"
          if [ "$state" = new ] && ! docker-compose run --rm -T web-tools \
               python scripts/web_version.py notes --version "$number" > /dev/null; then
            message="The site changed, so it will be version $number: add a '## $number ($date)' entry to docs/CHANGELOG.md."
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then echo "::error::$message"; exit 1; fi
            echo "::warning::$message"
          fi
      - name: Stamp the version on every page, and zip again
        env:
          NUMBER: ${{ steps.version.outputs.number }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          docker-compose run --rm -T web-tools python scripts/web_version.py stamp --site _site --version "$NUMBER" --date "$DATE"
          docker-compose run --rm -T web-tools python scripts/zip_site.py
          docker-compose run --rm -T web-tools python scripts/zip_hr.py
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site-zip
          path: |
            _site/StackImages-web.zip
            _site/HRDiagram-web.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A new version is published as a web-MAJOR.N release with both zips, its changelog entry as
  # the notes, and the site fingerprint (how the next build knows whether anything changed).
  # Never marked Latest, so the desktop download stays Latest. Older web-YYYYMMDD-HHMM and
  # hrdiagram-* releases predate version numbers.
  release:
    needs: [build, deploy]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.build.outputs.version_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      NUMBER: ${{ needs.build.outputs.version }}
      SNAPSHOTS: ${{ needs.build.outputs.snapshots }}
    steps:
      - uses: actions/checkout@v7  # for docs/CHANGELOG.md and scripts/web_version.py
      - uses: actions/download-artifact@v8
        with:
          name: site-zip
      - name: Publish the web-N release
        run: |
          set -euo pipefail
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad fingerprint '$FINGERPRINT'"; exit 1; }
          [[ "$NUMBER" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$NUMBER'"; exit 1; }
          for file in StackImages-web.zip HRDiagram-web.zip; do
            [ -s "$file" ] || { echo "::error::$file is missing"; exit 1; }
          done
          tag="web-$NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already exists (a re-run); nothing to publish."
            exit 0
          fi
          {
            python3 scripts/web_version.py notes --version "$NUMBER" \
              || echo "No changelog entry for $NUMBER (saved snapshots: ${SNAPSHOTS:-none})."
            cat <<EOF

          ---
          The pages: https://princetonuniversity.github.io/StackImages/ (Show Clusters and HR Diagram of
          Your Own Image). Changelog: https://github.com/PrincetonUniversity/StackImages/blob/main/docs/CHANGELOG.md

          To host a copy on another web site, unzip **StackImages-web.zip** (the whole site) or
          **HRDiagram-web.zip** (HR Diagram of Your Own Image on its own) and upload the folder
          unchanged; no server settings are needed (see HOSTING.txt inside).

          Saved snapshots: ${SNAPSHOTS:-none}. Built from $GITHUB_SHA.

          Site fingerprint: $FINGERPRINT
          EOF
          } > notes.md
          gh release create "$tag" StackImages-web.zip HRDiagram-web.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title "StackImages web $NUMBER" --notes-file notes.md
          echo "Published $tag"
