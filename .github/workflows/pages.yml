name: Pages (web)

# The Show Clusters web page. Independent of ci.yml (desktop): each has its own path
# filters and neither waits for the other. Checks and builds run in the pinned
# containers from compose.yaml (web-tools, lint-js).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "scripts/zip_hr.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "scripts/zip_hr.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:  # also started by snapshots.yml after publishing new snapshots

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      fingerprint: ${{ steps.zip.outputs.fingerprint }}
      hr_fingerprint: ${{ steps.zip.outputs.hr_fingerprint }}
      snapshots: ${{ steps.snapshots.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Build tool images
        run: docker-compose build web-tools
      - name: JavaScript lint and type checks (eslint, tsc)
        run: docker-compose run --rm -T lint-js sh -c "npm ci --ignore-scripts --no-audit --no-fund && npm run check"
      - name: Python lint, format and type checks (ruff, mypy)
        run: docker-compose run --rm -T web-tools sh -c "ruff check web scripts tests && ruff format --check web scripts tests && mypy"
      - name: Cache Pyodide
        uses: actions/cache@v6
        with:
          path: build/vendor
          key: pyodide-${{ hashFiles('scripts/vendor_pyodide.py') }}
      - name: Download and verify Pyodide
        # build/ is created here, as the runner user: if the root container created it
        # (on a cache miss), later steps could not write the snapshots into it.
        run: |
          mkdir -p build/vendor
          docker-compose run --rm -T web-tools python scripts/vendor_pyodide.py
      - name: Unit, snapshot and browser tests
        run: docker-compose run --rm -T web-tools python -m pytest -v -p no:cacheprovider tests/web
      - name: Fetch saved snapshots (latest snapshots-* release)
        id: snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '[.[].tagName | select(startswith("snapshots-"))] | sort | last // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern snapshots.tar.gz --dir build --clobber
            rm -rf build/snapshots && mkdir -p build/snapshots
            tar -xzf build/snapshots.tar.gz -C build/snapshots
            echo "Using $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "args=--snapshots build/snapshots" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No snapshots-* release yet; deploying without the saved-copy fallback."
            echo "args=--no-snapshots" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        run: docker-compose run --rm -T web-tools python scripts/build_site.py ${{ steps.snapshots.outputs.args }}
      - name: Zip the site, and the HR page on its own, for hosting elsewhere
        id: zip
        run: |
          docker-compose run --rm -T web-tools python scripts/zip_site.py
          docker-compose run --rm -T web-tools python scripts/zip_hr.py
          fingerprint=$(docker-compose run --rm -T web-tools python scripts/zip_site.py --fingerprint _site/StackImages-web.zip)
          hr_fingerprint=$(docker-compose run --rm -T web-tools python scripts/zip_hr.py --fingerprint _site/HRDiagram-web.zip)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "hr_fingerprint=$hr_fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site-zip
          path: |
            _site/StackImages-web.zip
            _site/HRDiagram-web.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Each zip also as a release, made only when its contents changed (the fingerprint leaves
  # out the build time, so a redeploy of the same site makes none) and never marked Latest,
  # so the desktop download stays Latest:
  #   web-YYYYMMDD-HHMM        StackImages-web.zip, the whole site
  #   hrdiagram-YYYYMMDD-HHMM  HRDiagram-web.zip, HR Diagram of Your Own Image on its own
  release:
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      HR_FINGERPRINT: ${{ needs.build.outputs.hr_fingerprint }}
      SNAPSHOTS: ${{ needs.build.outputs.snapshots }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-zip
      - name: Publish web-* and hrdiagram-* releases for the zips that changed
        run: |
          set -euo pipefail
          # publish PREFIX ZIP FINGERPRINT TITLE NOTES_FILE
          publish() {
            local prefix=$1 file=$2 print=$3 title=$4 notes=$5 last tag
            [[ "$print" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad fingerprint '$print' for $file"; exit 1; }
            [ -s "$file" ] || { echo "::error::$file is missing"; exit 1; }
            last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                     --jq "[.[].tagName | select(startswith(\"$prefix-\"))] | sort | last // \"\"")
            if [ -n "$last" ] && gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                 | grep -qF "Site fingerprint: $print"; then
              echo "$file is unchanged since $last; no new release."
              return 0
            fi
            tag="$prefix-$(date -u +%Y%m%d-%H%M)"
            printf '\nBuilt from %s.\n\nSite fingerprint: %s\n' "$GITHUB_SHA" "$print" >> "$notes"
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest=false --title "$title $tag" --notes-file "$notes"
            echo "Published $tag"
          }

          cat > web-notes.md <<EOF
          The StackImages web pages (Show Clusters and HR Diagram of Your Own Image) as one zip,
          for hosting a copy on another web site. Unzip it and upload the \`StackImages\` folder
          unchanged; no server settings are needed (see HOSTING.txt inside).

          The current version is always at https://princetonuniversity.github.io/StackImages/StackImages-web.zip

          Saved snapshots: ${SNAPSHOTS:-none}.
          EOF
          publish web StackImages-web.zip "$FINGERPRINT" "StackImages web copy" web-notes.md

          cat > hr-notes.md <<EOF
          HR Diagram of Your Own Image on its own (about 43 MB, with its own copy of Pyodide),
          for hosting on another web site. Unzip it and upload the \`HRDiagram\` folder unchanged;
          no server settings are needed (see HOSTING.txt inside).

          The current version is always at https://princetonuniversity.github.io/StackImages/HRDiagram-web.zip
          and the page itself at https://princetonuniversity.github.io/StackImages/HRDiagram/
          EOF
          publish hrdiagram HRDiagram-web.zip "$HR_FINGERPRINT" "HR Diagram web copy" hr-notes.md
