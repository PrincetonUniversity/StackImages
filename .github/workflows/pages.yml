name: Pages (web)

# The Show Clusters web page. Independent of ci.yml (desktop): each has its own path
# filters and neither waits for the other. Checks and builds run in the pinned
# containers from compose.yaml (web-tools, lint-js).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_pyodide.py"
      - "scripts/build_site.py"
      - "scripts/build_snapshots.py"
      - "scripts/zip_site.py"
      - "tests/web/**"
      - "csv/NI2021_*.csv"
      - "csv/ICObj.csv"
      - "csv/hygdata_v3.csv"
      - "fit/sxv_psf4-RGB.fit"
      - "requirements-web.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "pyproject.toml"
      - "compose.yaml"
      - "ci/web-tools.Dockerfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:  # also started by snapshots.yml after publishing new snapshots

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      fingerprint: ${{ steps.zip.outputs.fingerprint }}
      snapshots: ${{ steps.snapshots.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Build tool images
        run: docker-compose build web-tools
      - name: JavaScript lint and type checks (eslint, tsc)
        run: docker-compose run --rm -T lint-js sh -c "npm ci --ignore-scripts --no-audit --no-fund && npm run check"
      - name: Python lint, format and type checks (ruff, mypy)
        run: docker-compose run --rm -T web-tools sh -c "ruff check web scripts tests && ruff format --check web scripts tests && mypy"
      - name: Cache Pyodide
        uses: actions/cache@v6
        with:
          path: build/vendor
          key: pyodide-${{ hashFiles('scripts/vendor_pyodide.py') }}
      - name: Download and verify Pyodide
        # build/ is created here, as the runner user: if the root container created it
        # (on a cache miss), later steps could not write the snapshots into it.
        run: |
          mkdir -p build/vendor
          docker-compose run --rm -T web-tools python scripts/vendor_pyodide.py
      - name: Unit, snapshot and browser tests
        run: docker-compose run --rm -T web-tools python -m pytest -v -p no:cacheprovider tests/web
      - name: Fetch saved snapshots (latest snapshots-* release)
        id: snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '[.[].tagName | select(startswith("snapshots-"))] | sort | last // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern snapshots.tar.gz --dir build --clobber
            rm -rf build/snapshots && mkdir -p build/snapshots
            tar -xzf build/snapshots.tar.gz -C build/snapshots
            echo "Using $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "args=--snapshots build/snapshots" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No snapshots-* release yet; deploying without the saved-copy fallback."
            echo "args=--no-snapshots" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        run: docker-compose run --rm -T web-tools python scripts/build_site.py ${{ steps.snapshots.outputs.args }}
      - name: Zip the site for hosting elsewhere (served as StackImages-web.zip)
        id: zip
        run: |
          docker-compose run --rm -T web-tools python scripts/zip_site.py
          fingerprint=$(docker-compose run --rm -T web-tools python scripts/zip_site.py --fingerprint _site/StackImages-web.zip)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site-zip
          path: _site/StackImages-web.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The zip also as a release (web-YYYYMMDD-HHMM, never marked Latest, so the desktop
  # download stays Latest). Made only when the site's contents changed: the fingerprint
  # leaves out the build time, so a redeploy of the same site makes no release.
  release:
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      SNAPSHOTS: ${{ needs.build.outputs.snapshots }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-zip
      - name: Publish a web-* release if the site changed
        run: |
          set -euo pipefail
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad fingerprint '$FINGERPRINT'"; exit 1; }
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                   --jq '[.[].tagName | select(startswith("web-"))] | sort | last // ""')
          if [ -n "$last" ]; then
            body=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if grep -qF "Site fingerprint: $FINGERPRINT" <<< "$body"; then
              echo "The site is unchanged since $last; no new release."
              exit 0
            fi
          fi
          tag="web-$(date -u +%Y%m%d-%H%M)"
          cat > notes.md <<EOF
          Show Clusters as one zip, for hosting a copy on another web site. Unzip it and upload the
          \`StackImages\` folder unchanged; no server settings are needed (see HOSTING.txt inside).

          The current version is always at https://princetonuniversity.github.io/StackImages/StackImages-web.zip

          Built from $GITHUB_SHA with saved snapshots ${SNAPSHOTS:-none}.

          Site fingerprint: $FINGERPRINT
          EOF
          gh release create "$tag" StackImages-web.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false \
            --title "Show Clusters web copy $tag" --notes-file notes.md
          echo "Published $tag"
