name: CI (desktop)

# Desktop wxPython app: tests in a pinned container under a virtual display,
# then the minimal student bundle (PyWin.tar). The web page has its own
# workflow (pages.yml); the two never block each other.
on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v1
        with:
          version: v2.39.4
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Build desktop test image
        run: docker-compose build desktop-tests
      - name: Run desktop and packaging tests (Xvfb)
        run: docker-compose run --rm -T desktop-tests
      - name: Install zsh for packaging
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Build PyWin.tar
        run: scripts/package_pywin.sh --out dist/PyWin.tar
      - uses: actions/upload-artifact@v4
        with:
          name: PyWin
          path: dist/PyWin.tar
          if-no-files-found: error

  create-release:
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PyWin
          path: dist
      - name: Create GitHub release with PyWin.tar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v-${GITHUB_SHA}" dist/PyWin.tar \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Release ${GITHUB_SHA}" --notes "Desktop bundle built from ${GITHUB_SHA}."
