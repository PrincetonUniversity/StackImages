name: CI (desktop)

# Desktop wxPython app: tests in a pinned container under a virtual display,
# then the minimal student bundle (PyWin.tar). The web page has its own
# workflow (pages.yml); the two never block each other. web/showclusters.py and
# web/hrimage.py still trigger this workflow because equivalence tests check them against ass.py.
# Markdown alone (README.md, docs/) doesn't: the bundled README is refreshed by the next release.
on:
  push:
    branches: [main]
    paths-ignore: ["web/*.js", "web/*.html", "web/*.css", "web/hrdiagram/**", "docs/**", "**.md", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["web/*.js", "web/*.html", "web/*.css", "web/hrdiagram/**", "docs/**", "**.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - name: Provide docker-compose command
        run: echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
      - name: Build desktop test image
        run: docker-compose build desktop-tests
      - name: Run desktop and packaging tests (Xvfb)
        run: docker-compose run --rm -T desktop-tests
      - name: Install zsh for packaging
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Build PyWin.tar
        run: scripts/package_pywin.sh --out dist/PyWin.tar
      - uses: actions/upload-artifact@v7
        with:
          name: PyWin
          path: dist/PyWin.tar
          if-no-files-found: error

  create-release:
    needs: test-and-package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: PyWin
          path: dist
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Decide the version (v<ass.py version>.<n>; skip if the bundle is unchanged)
        id: version
        run: |
          app=$(scripts/package_pywin.sh --app-version)
          fingerprint=$(scripts/package_pywin.sh --fingerprint)
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > releases.json
          tag=$(python3 scripts/next_release.py --app-version "$app" --fingerprint "$fingerprint" --releases releases.json)
          {
            echo "app=$app"
            echo "fingerprint=$fingerprint"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::PyWin.tar's app and data files are unchanged since the last release; no new release."
          else
            echo "Next release: $tag"
          fi
      - name: Create GitHub release with PyWin.tar
        if: steps.version.outputs.tag != ''
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/PyWin.tar \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "StackImages ${tag#v}" \
            --notes "Desktop StackImages bundle (\`PyWin.tar\`): ass.py version ${{ steps.version.outputs.app }}, built from ${GITHUB_SHA}.

          Install or update: see the README (https://github.com/$GITHUB_REPOSITORY#readme).
          Try ShowClusters in the browser: https://princetonuniversity.github.io/StackImages/ShowClusters/

          Bundle fingerprint: ${{ steps.version.outputs.fingerprint }}"
