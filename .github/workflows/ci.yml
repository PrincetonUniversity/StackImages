name: CI (conda)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    outputs:
      tar_name: ${{ steps.create_tar.outputs.tar_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          activate-environment: BobsAstro
          environment-file: environment.yml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Create release tar (uncompressed .tar)
        id: create_tar
        env:
          TAR_NAME: "PyWin.tar"
        run: |
          mkdir -p dist
          git ls-files | tar -cf dist/${TAR_NAME} -T -
          echo "tar_name=${TAR_NAME}" >> $GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyWin
          path: dist/PyWin.tar

  create-release:
    needs: test-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (tar)
        uses: actions/download-artifact@v4
        with:
          name: stackimages-tar
          path: dist


      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: "v-${{ github.sha }}"
          release_name: "Release ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tar to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/PyWin.tar
          asset_name: PyWin.tar
          asset_content_type: application/x-tar
