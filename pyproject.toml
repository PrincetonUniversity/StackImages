# Tooling for new code only. Bob's desktop app (ass.py and friends) is not linted.
[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
target-version = "py311"  # desktop container is 3.11; Pyodide is 3.13
line-length = 110
include = ["web/*.py", "scripts/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/desktop/test_gui_titles.py" = ["UP031", "UP022"]  # pre-existing test, unchanged style

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["web/showclusters.py", "tests/web", "tests/packaging", "tests/desktop/test_web_equivalence.py"]

[[tool.mypy.overrides]]
module = ["ass"]
follow_imports = "skip"
